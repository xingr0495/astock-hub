# astock-hub 配置模板
#
# 可选配置：复制为 config.toml 后修改。config.toml 与 .env 均被 .gitignore 排除。
# 不复制也能启动，程序会读取本模板。相对路径以项目根目录为基准。
# 付费服务请优先在面板「数据源 / 大模型」页面填写，避免把密钥写进文件。

[tencent]
# 免费行情源，无需凭证。
base_url = "https://qt.gtimg.cn/q="

[national_team]
# 可选：宽基 ETF 份额文件。没有文件时对应卡片会如实显示不可用。
etf_json_path = ""
etf_json_daily_path = "data/nt_etf_daily.json"
# 可选：自行维护份额抓取脚本时使用的运行环境。
etf_project_dir = ""
etf_python = ""

[zsxq]
# 可选：用户自己已获授权的纪要报告目录。仓库不附带纪要内容。
output_dir = ""
group_id = ""

[hithink]
# 可选：hithink-finance CLI，需自行安装、登录并完成初始化。
cli = "hithink-finance"
timeout_sec = 30

[tushare]
# 可选：也可在面板「数据源」页面保存 token。
api_key = ""
base_url = "https://api.tushare.pro"

[data_source]
# K 线主源：axdata（默认）/ astock_data / hithink；失败时按 fallback 降级。
primary = "axdata"
fallback = "hithink"
tdx_sync_protocol = true

[a_stock_data]
# 可选：a-stock-data 工具包路径；留空时使用内置适配与公开接口。
skill_path = ""

[ta]
# 可选：外部 TradingAgents-astock 环境。未配置时不影响其他功能。
project_dir = ""
python = ""
run_script = ""
provider = "openai_compatible"
backend_url = ""
deep_model = ""
quick_model = ""
timeout_sec = 2400

[llm]
# 可选：OpenAI 兼容接口。推荐在「大模型」页面配置，密钥不会写入仓库。
backend_url = ""
deep_model = ""
quick_model = ""
env_file = ""
timeout_sec = 120

[web]
disable_tickflow = true

[notify]
# 推送默认关闭；Webhook 请在面板「推送设置」中填写。
enabled = false
filter = []

[[notify.targets]]
url = ""
type = "feishu"

[alert]
data_dir = "data"

[hithink_data]
# 全市场历史数据缓存。全市场看板/情绪/主线需要先初始化本地数据，
# 或让程序从可用数据源逐步建立缓存；详见 docs/INSTALL.md。
cache_dir = "data/hithink_cache"
store_dir = "data"
