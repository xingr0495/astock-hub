[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astock-hub"
version = "0.3.0"
description = "可自托管的 A 股数据聚合与 AI 研究面板（系统显示名称：Mind AShare）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "duckdb>=1.0",
    # 技术指标计算（从 tickflow 移植，公式用 polars 表达式照搬以保证数值逐位一致）
    "polars>=1,<2",
    "pandas>=2",
    "pypdf",
    "python-docx",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8"]
# TdxQuant 付费源（通达信量化数据）：Key 探测用；公开 PyPI，DLL 随 wheel 分发
tdxquant = ["tdxaidata>=1.2.2"]

[project.scripts]
astock-hub = "astock_hub.cli:main"

[tool.setuptools.packages.find]
include = ["astock_hub*"]
